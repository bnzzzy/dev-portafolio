<footer class="footer">
  <div class="footer__inner container">
    <div class="footer__brand">
      <img class="footer__logo" [src]="site.logoFull" [alt]="site.name + ' - ' + site.role" width="285" height="72" />
      <span class="label text-outline">© {{ year }} {{ site.name }}</span>
    </div>
    <nav class="footer__links" aria-label="Redes">
      <a class="social social--github" [href]="site.github.url" target="_blank" rel="noopener" aria-label="GitHub" title="GitHub">
        <span class="brand-icon brand-icon--github"></span>
      </a>
      <a class="social social--linkedin" [href]="site.linkedin.url" target="_blank" rel="noopener" aria-label="LinkedIn" title="LinkedIn">
        <span class="brand-icon brand-icon--linkedin"></span>
      </a>
      <a class="social" [href]="'mailto:' + site.contact.email" aria-label="Email" title="Email">
        <span class="icon">alternate_email</span>
      </a>
    </nav>
  </div>
</footer>
