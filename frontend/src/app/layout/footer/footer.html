<footer class="footer">
  <div class="footer__inner container">
    <div class="footer__brand">
      <div class="footer__id">
        <img class="footer__logo" [src]="site.logo" alt="" width="54" height="32" />
        <div class="footer__text">
          <span class="footer__name">{{ site.name }}</span>
          <span class="label muted">{{ site.role }}</span>
        </div>
      </div>
      <span class="label text-outline">© {{ year }} {{ site.name }}</span>
    </div>
    <nav class="footer__links" aria-label="Redes">
      <a class="social social--github" [href]="site.github.url" target="_blank" rel="noopener" aria-label="GitHub (abre en una pestaña nueva)" title="GitHub">
        <span class="brand-icon brand-icon--github" aria-hidden="true"></span>
      </a>
      <a class="social social--linkedin" [href]="site.linkedin.url" target="_blank" rel="noopener" aria-label="LinkedIn (abre en una pestaña nueva)" title="LinkedIn">
        <span class="brand-icon brand-icon--linkedin" aria-hidden="true"></span>
      </a>
      <a class="social" [href]="'mailto:' + site.contact.email" [attr.aria-label]="'Email: ' + site.contact.email" [title]="site.contact.email">
        <span class="icon" aria-hidden="true">alternate_email</span>
      </a>
    </nav>
  </div>
</footer>
