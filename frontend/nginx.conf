server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Las llamadas a /api se reenvían al contenedor del backend
  location /api/ {
    proxy_pass http://backend:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  # Angular maneja las rutas: cualquier URL desconocida sirve index.html
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Cache largo para archivos con hash (js, css)
  location ~* \.(js|css|woff2?|png|jpg|jpeg|svg|webp|ico)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
}
