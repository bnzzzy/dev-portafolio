server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;

  # Cabeceras de seguridad. Se repiten en el location de archivos estáticos
  # porque en nginx un add_header dentro de un location anula los del server.
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  # Las llamadas a /api se reenvían al contenedor del backend
  location /api/ {
    proxy_pass http://backend:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    client_max_body_size 32k;
  }

  # Angular maneja las rutas: cualquier URL desconocida sirve index.html
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Cache largo para archivos con hash (js, css)
  location ~* \.(js|css|woff2?|png|jpg|jpeg|svg|webp|ico)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  }
}
